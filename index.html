<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kebun GROW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#0F6B3E;--g2:#1F8F55;--gD:#0A4A2A;--leaf:#4CC36E;--br:#6E3434;--br2:#8B4A3A;--cream:#FFF8EA;--sun:#FFC93C;--ink:#23302A;--red:#E5533D;--mut:#7C8A80;
  --fd:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--fn:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;height:100%;overflow:hidden;background:#5E9E62}
body{font-family:var(--fn);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;-webkit-user-select:text;user-select:text}

/* ---------- frame: lebar 100%, tinggi maks 600px ---------- */
#app{position:relative;width:100%;height:min(177.78vw,600px);overflow:hidden;background:#5E9E62}
/* latar dunia di luar area inti 600px: menyambung dengan latar permainan */
#world{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#world .wl{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
#world .wl.on{opacity:1}
#world svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#wRays{position:absolute;width:10px;height:10px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);animation:spin 70s linear infinite}
#wDim{position:absolute;inset:0;background:rgba(10,40,24,.55);opacity:0;transition:opacity .35s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#app.dim #wDim{opacity:1}
#stage{position:absolute;left:50%;top:50%;width:360px;height:640px;overflow:hidden;transform:translate(-50%,-50%);transform-origin:50% 50%;background:transparent;z-index:1}
#stage.framed{border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.layer{position:absolute;inset:0}
#scene{z-index:1}
#scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
.cloud{position:absolute;height:22px;border-radius:20px;background:#fff;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:26px;height:26px;left:10px;top:-12px}.cloud::after{width:18px;height:18px;left:30px;top:-7px}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(420px)}}
#tika{position:absolute;left:-4px;top:58px;height:204px;width:auto;transform-origin:50% 100%;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
#tika.jump{animation:jump .5s 2}#tika.nod{animation:nod .7s}#tika.sway{animation:sway 1.4s ease-in-out infinite}#tika.sad{animation:sad .9s forwards}
@keyframes jump{50%{transform:translateY(-12px) scale(1.02,.98)}}
@keyframes nod{50%{transform:rotate(2.5deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes sad{to{transform:rotate(-3deg) scale(.98);filter:saturate(.6) drop-shadow(0 4px 0 rgba(0,0,0,.12))}}
#tree{position:absolute;left:210px;top:114px;width:146px;height:146px;z-index:2;transition:filter .6s,transform .6s;transform-origin:50% 100%}
#tree svg{width:100%;height:100%;overflow:visible}
#tree [data-t]{transition:opacity .8s,transform .8s var(--spring);transform-box:fill-box;transform-origin:50% 100%}
#tree.wilt{filter:saturate(.35) brightness(.9);transform:rotate(-4deg)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:50px;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 58px 8px 8px;transition:transform .5s var(--smooth),opacity .4s}
#hud.hide{transform:translateY(-120%);opacity:0}
.lt{width:30px;height:32px;border-radius:10px;background:#fff;color:#b9c3bc;font:700 18px/32px var(--fd);text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:background .3s,color .3s}
.lt.on{background:var(--sun);color:var(--ink);animation:ltp 1s ease-in-out infinite}
.lt.dn{background:var(--g);color:#fff}
@keyframes ltp{50%{transform:translateY(-2px)}}
#stg{flex:1;min-width:0;font:700 12px var(--fd);color:var(--gD);background:rgba(255,255,255,.75);border-radius:10px;padding:3px 8px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stg small{display:block;font:800 9px var(--fn);color:var(--mut);letter-spacing:.6px}
#star{margin-left:auto;background:#fff;border-radius:10px;padding:0 9px;height:32px;display:flex;align-items:center;gap:3px;font:700 15px var(--fd);color:#B07A00;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#bgmBtn{position:absolute;right:8px;top:8px;z-index:68;width:42px;height:34px;border-radius:11px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);display:grid;place-items:center;transition:transform .12s}
#bgmBtn:active{transform:translateY(3px);box-shadow:none}
#bgmBtn svg{width:28px;height:24px}
#bgmBtn .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate}
#bgmBtn .eq rect:nth-child(2){animation-delay:.25s}#bgmBtn .eq rect:nth-child(3){animation-delay:.5s}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#bgmBtn .x{display:none}#bgmBtn.off .eq{display:none}#bgmBtn.off .x{display:inline}

/* ---------- speech bubble ---------- */
#bub{position:absolute;left:110px;top:56px;width:242px;z-index:20;background:#fff;border-radius:18px;padding:22px 13px 14px;font:800 13px/1.42 var(--fn);color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.08),0 10px 24px rgba(10,60,30,.22);opacity:0;transform:scale(.6);transform-origin:0 40px;pointer-events:none;transition:opacity .2s,transform .35s var(--spring)}
#bub.show{opacity:1;transform:none}
#bub::before{content:'';position:absolute;left:-7px;top:34px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}
#bub .who{position:absolute;top:-11px;left:10px;display:flex;align-items:center;gap:5px;background:var(--g);color:#fff;font:600 12px var(--fd);padding:3px 11px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
#bub .who em{font:800 8px var(--fn);font-style:normal;background:rgba(255,255,255,.22);padding:2px 6px;border-radius:999px;letter-spacing:.4px}
.av{width:22px;height:22px;border-radius:50%;background-color:#E6F5EA;background-image:var(--tika);background-size:76px auto;background-position:-27px -4px;flex:none}
#bub b{color:var(--g)}
#bub .nx{position:absolute;right:10px;bottom:3px;font-size:10px;color:#9fb0a5;opacity:0}
#bub .nx.on{opacity:1;animation:nudge .7s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateY(3px)}}
#bub.live .nx{display:none}
.ch{opacity:0}.ch.on{opacity:1}

/* ---------- game panel ---------- */
#panel{position:absolute;left:8px;right:8px;top:268px;height:346px;z-index:10;background:var(--cream);border-radius:20px;border:3px solid #E9D9B4;
  box-shadow:0 5px 0 #C9B48A,0 12px 26px rgba(0,0,0,.18);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  opacity:0;transform:translateY(30px) scale(.96);pointer-events:none;transition:opacity .35s,transform .45s var(--spring)}
#panel.show{opacity:1;transform:none;pointer-events:auto}
.ph{display:flex;align-items:center;gap:7px;min-height:26px}
.tag{flex:none;background:var(--g);color:#fff;font:700 11px var(--fd);padding:4px 9px;border-radius:999px;letter-spacing:.3px}
.pi{flex:1;display:flex;align-items:center;gap:6px;font:800 11.5px/1.25 var(--fn);color:var(--gD)}
.pi i{flex:none;font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font:700 11px var(--fd);color:var(--ink)}
.cnt{flex:none;font:700 12px var(--fd);color:var(--br);background:#F3E6CC;border-radius:999px;padding:3px 8px}
.prow{display:flex;align-items:center;gap:8px;min-height:44px}
.pt{flex:1;font:800 11.5px/1.3 var(--fn);color:#6b5a45;min-height:30px;display:flex;align-items:center}
.pt.good{color:#16995c}.pt.bad{color:var(--red)}
.bt{flex:none;background:var(--g);color:#fff;border-radius:14px;padding:0 16px;height:42px;font:700 15px var(--fd);box-shadow:0 4px 0 var(--gD);transition:transform .1s,box-shadow .1s,filter .2s,opacity .2s}
.bt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gD)}
.bt[disabled]{filter:grayscale(1);opacity:.45;pointer-events:none}
.bt.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #C58F00}
.bt.wide{width:100%;height:48px;font-size:17px}
.bt.pulse{animation:btp 1s ease-in-out infinite}
@keyframes btp{50%{transform:scale(1.06)}}
.sv{width:100%;flex:1;min-height:0;display:block;touch-action:none}

/* G */
.bud.chosen circle:nth-of-type(2){stroke:#FFC93C;stroke-width:5}
.pot .ring{fill:none;stroke:var(--red);stroke-width:2.5;stroke-dasharray:5 4;opacity:0}
.pot.tgt .ring{opacity:1;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pot .lbl{opacity:0;font:800 9px var(--fn);fill:#fff}
.pot.tgt .lbl,.pot.tgt .lblb{opacity:1}
.pot .lblb{opacity:0}
.pot.lit .glow{opacity:1}
.pot .glow{opacity:0;transition:opacity .3s}
#mr{cursor:grab}

/* R */
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:7px;min-height:0;perspective:600px}
.cd{position:relative;border-radius:14px;transform-style:preserve-3d;transition:transform .5s var(--smooth)}
.cd .fc{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px;text-align:center}
.cd .fr{background:#fff;border:2.5px dashed #CDBB93}
.cd .fr i{font-style:normal;font-size:30px;line-height:1}
.cd .fr b{font:700 13px var(--fd)}
.cd .fr span{font:800 9.5px var(--fn);color:#fff;background:var(--g);border-radius:999px;padding:2px 8px;margin-top:3px}
.cd .bk{background:#FFF3D6;border:2.5px solid #E0BF72;transform:rotateY(180deg)}
.cd .bk i{font-style:normal;font-size:20px;line-height:1}
.cd .bk b{font:700 12px var(--fd)}
.cd .bk p{font:800 10px/1.25 var(--fn);color:#5b4c39}
.cd.flip{transform:rotateY(180deg)}
.cd.on .bk{background:#FDE7E2;border-color:var(--red)}
.cd.on::after{content:'⚠️';position:absolute;right:-5px;top:-7px;font-size:16px;transform:rotateY(180deg)}
.cd.good .bk{background:#DFF5E8;border-color:#16995c}
.cd.shake{animation:shk .35s}
@keyframes shk{25%{translate:-4px 0}75%{translate:4px 0}}

/* W */
.tasks{flex:none;display:flex;flex-direction:column;gap:4px}
.tk{background:#fff;border:2px solid #E9D9B4;border-radius:11px;padding:3px 6px 4px;transition:border-color .3s,background .3s}
.tk.ok{border-color:#16995c;background:#F1FBF4}
.tk.err{border-color:var(--red);animation:shk .35s}
.tk h4{font:700 11.5px/1.2 var(--fd);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.tk h4 .st{margin-left:auto;font:800 9px var(--fn);color:var(--mut)}
.chips{display:flex;gap:3px;align-items:center}
.chips+.chips{margin-top:3px}
.chips em{font:800 9px var(--fn);font-style:normal;color:var(--mut);width:34px;flex:none}
.chip{flex:1;height:21px;border-radius:7px;background:#F3EBDA;font:800 10px var(--fn);color:#6b5a45;padding:0 2px;white-space:nowrap;transition:background .2s,transform .15s}
.chip.on{background:var(--sun);color:var(--ink);box-shadow:inset 0 -2px 0 #C58F00}
.chip.on.v2{background:var(--g);color:#fff;box-shadow:inset 0 -2px 0 var(--gD)}
.chip:active{transform:scale(.94)}
.wr{display:flex;gap:4px}.wr span{flex:1;text-align:center;background:#FFF1C9;border:1.5px solid #F3D27A;border-radius:9px;padding:4px 2px;font:800 9.5px var(--fn);color:#6b5a45;white-space:nowrap}
.week{display:flex;align-items:center;gap:4px;margin-top:auto}
.week span{flex:1;text-align:center;padding:3px 0;border-radius:8px;background:#EFE5D0;font:800 10px var(--fn);color:#8a7a62;transition:background .2s}
.week span.on{background:var(--sun);color:var(--ink)}
.week b{width:34px;text-align:center;font-size:22px;line-height:1}

/* stage-clear card */
.clear{position:absolute;inset:0;z-index:5;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:14px 18px}
.clear .unl{font:800 11px var(--fn);color:var(--mut);letter-spacing:1.2px}
.clear .big{display:flex;align-items:center;gap:10px}
.clear .big b{width:52px;height:52px;border-radius:16px;background:var(--g);color:#fff;font:700 32px/52px var(--fd);box-shadow:0 4px 0 var(--gD)}
.clear .big span{font:700 24px var(--fd);color:var(--gD)}
.clear .stars{font-size:28px;letter-spacing:4px}
.clear .stars i{font-style:normal;display:inline-block}
.clear .q{font:700 14px/1.25 var(--fd);color:var(--br);background:#F3E6CC;border-radius:12px;padding:6px 12px}
.clear p{font:800 13px/1.45 var(--fn);color:#4b4033}
.clear p b{color:var(--g)}

/* ---------- overlays ---------- */
#ui{z-index:40;pointer-events:none}
#ui>*{pointer-events:auto}
#ui>.caption{pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(10,40,24,.55);backdrop-filter:blur(2px)}
.card{position:absolute;left:12px;right:12px;background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.3);overflow:auto;-webkit-overflow-scrolling:touch}
.caption{position:absolute;left:50%;top:150px;transform:translate(-50%,-50%) rotate(-2deg);background:var(--sun);color:var(--ink);font:700 20px/1.15 var(--fd);padding:10px 20px;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.15);text-align:center;white-space:nowrap;z-index:50}
.caption small{display:block;font:800 10px var(--fn);letter-spacing:1.5px;opacity:.7}
.caption em{display:flex;align-items:center;justify-content:center;gap:4px;font:800 11px var(--fn);font-style:normal;background:#fff;border-radius:999px;padding:3px 10px;margin-top:6px;color:var(--g)}
/* papan tahap pohon di kebun */
#sign{position:absolute;left:146px;top:196px;width:64px;z-index:2;transform-origin:50% 100%}
#sign .bd{background:#E2B985;border:2px solid #8B5E3C;border-radius:8px;padding:3px 2px;text-align:center;font:700 11px/1.1 var(--fd);color:#3d2a17;box-shadow:0 2px 0 rgba(0,0,0,.18)}
#sign .bd small{display:block;font:800 7.5px var(--fn);color:#6b4a2b;letter-spacing:.4px}
#sign .stk{width:5px;height:22px;background:#8B5E3C;margin:0 auto;border-radius:0 0 2px 2px}
/* popup pertumbuhan */
.gpop{position:absolute;left:16px;right:16px;top:64px;background:#fff;border-radius:24px;padding:14px 14px 14px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.3);overflow:hidden}
.gpop .gchip{display:inline-block;background:var(--g);color:#fff;font:700 12px var(--fd);padding:4px 12px;border-radius:999px;letter-spacing:.5px}
.gstage{position:relative;width:206px;height:196px;margin:6px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 55%,#FFF6CF 0%,#E8F7EC 62%,rgba(232,247,236,0) 72%)}
.gstage .gr2{position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,201,60,.22) 0 9deg,transparent 9deg 18deg);animation:spin 18s linear infinite;opacity:0;transition:opacity .6s}
.gstage.lit .gr2{opacity:1}
.gstage .gt{position:absolute;inset:0}
.gstage svg{width:100%;height:100%;overflow:visible}
.gstage [data-t]{transition:opacity .5s;transform-box:fill-box;transform-origin:50% 100%}
.gspark{position:absolute;left:50%;top:50%;font-size:16px;pointer-events:none}
.gname small{display:block;font:800 9.5px var(--fn);color:var(--mut);letter-spacing:1px}
.gname b{font:700 26px/1.1 var(--fd);color:var(--gD)}
.gtrack{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin:8px 4px 6px}
.gtrack::before{content:'';position:absolute;left:22px;right:22px;top:21px;height:4px;background:#E6ECE8;border-radius:2px}
.gtrack .bar{position:absolute;left:22px;top:21px;height:4px;background:var(--leaf);border-radius:2px;transition:width .9s var(--smooth)}
.gn{position:relative;z-index:1;width:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.gn i{width:44px;height:44px;border-radius:50%;background:#F1F4F2;border:2.5px solid #DDE5DF;display:block;overflow:hidden;filter:grayscale(1) opacity(.55);transition:all .4s}
.gn i svg{width:100%;height:100%}
.gn span{font:800 9px var(--fn);color:#9aa59e}
.gn.dn i{filter:none;background:#E3F6EA;border-color:var(--leaf)}
.gn.dn span{color:var(--g)}
.gn.cur i{border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,201,60,.45);animation:btp 1s ease-in-out infinite}
.gn.cur span{color:#B07A00}
.gpop p{font:800 12.5px/1.4 var(--fn);color:#4b4033;margin:2px 4px 10px}
.gpop p b{color:var(--g)}
/* pohon di debrief */
.dtree{position:relative;flex:none;width:80px;height:96px;border-radius:18px;background:radial-gradient(circle at 50% 50%,#FFF6CF 0%,#E3F6EA 75%);border:2px solid #CDEBD7}
.dtree svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.dtree .sp{position:absolute;font-size:12px;animation:float 2.4s ease-in-out infinite alternate}
.deb .top .score{margin:5px 0 0;padding:4px 8px}
.deb .top .score b{font-size:15px}
.dsub{font:800 10.5px var(--fn);color:var(--mut)}

/* start */
.start{position:absolute;inset:0;overflow:hidden;background:transparent}
.start .rays{position:absolute;left:50%;top:240px;width:900px;height:900px;margin:-450px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);animation:spin 70s linear infinite}
.start .fl{position:absolute;font-size:22px;opacity:.35;animation:float 4s ease-in-out infinite alternate}
@keyframes float{from{translate:0 0;rotate:-8deg}to{translate:0 -10px;rotate:8deg}}
.sTitle{position:absolute;left:0;right:0;top:40px;text-align:center;color:#fff}
.sTitle .chipM{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);font:700 12px var(--fd);padding:4px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sTitle h1{font:700 44px/1 var(--fd);margin-top:10px;text-shadow:0 4px 0 rgba(0,40,20,.35);letter-spacing:.5px}
.sTitle h1 span{color:var(--sun)}
.sTitle p{font:800 13px/1.35 var(--fn);color:#E7FFE9;margin-top:6px}
.sTika{position:absolute;left:50%;top:176px;height:226px;transform:translateX(-50%);filter:drop-shadow(0 8px 0 rgba(0,40,20,.25))}
.sCard{position:absolute;left:14px;right:14px;bottom:30px;background:#fff;border-radius:22px;padding:16px 16px 14px;box-shadow:0 6px 0 rgba(0,0,0,.15),0 16px 36px rgba(0,0,0,.3);z-index:2}
.sCard label{display:block;font:700 15px var(--fd);margin-bottom:6px}
.sapa{display:flex;gap:6px;margin-bottom:10px}
.sapa button{flex:1;height:38px;border-radius:12px;background:#F1F4F2;border:2.5px solid #DDE5DF;font:700 15px var(--fd);color:#5d6b61;transition:all .2s}
.sapa button.on{background:#E3F6EA;border-color:var(--g);color:var(--g);transform:translateY(-2px);box-shadow:0 3px 0 var(--g)}
.sCard input{width:100%;height:44px;border:2.5px solid #DDE5DF;border-radius:13px;padding:0 13px;font:800 16px var(--fn);color:var(--ink);background:#F7FAF8;outline:none;transition:border-color .2s}
.sCard input:focus{border-color:var(--g);background:#fff}
.sCard .pv{font:800 11px var(--fn);color:var(--mut);margin:6px 2px 0;min-height:15px}
.sCard .pv b{color:var(--g)}
.sCard .bt{margin-top:8px}
.sCard .snd{text-align:center;font:800 10px var(--fn);color:#9aa59e;margin-top:8px}

/* petunjuk */
.guide{top:58px;bottom:34px;padding:16px 14px 14px}
.guide h2{font:700 22px var(--fd);color:var(--g);text-align:center}
.guide .sub{font:800 11.5px/1.35 var(--fn);color:var(--mut);text-align:center;margin:3px 0 10px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gc{background:#F3FAF5;border-radius:14px;padding:8px 8px 9px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.gc .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:22px;position:relative}
.gc .ic b{position:absolute;left:-6px;top:-6px;width:20px;height:20px;border-radius:7px;background:var(--g);color:#fff;font:700 12px/20px var(--fd)}
.gc strong{font:700 12.5px var(--fd)}
.gc span{font:800 10px/1.3 var(--fn);color:#5d6b61}
.rules{margin-top:9px;display:grid;gap:5px}
.rules div{display:flex;align-items:center;gap:9px;background:#FFF8E6;border-radius:12px;padding:6px 10px;font:800 11px/1.3 var(--fn)}
.rules div i{font-style:normal;font-size:18px;flex:none;width:24px;text-align:center}
.guide .bt{margin-top:10px}

/* debrief */
.deb{top:8px;bottom:26px;padding:10px 12px 12px;text-align:center}
.deb .top{display:flex;align-items:center;gap:10px;text-align:left}
.deb .top .av{width:52px;height:52px;background-size:180px auto;background-position:-64px -6px;border:3px solid #E3F6EA}
.deb .chipM{display:inline-block;background:var(--g);color:#fff;font:700 10px var(--fd);padding:2px 9px;border-radius:999px;letter-spacing:.5px}
.deb h2{font:700 19px/1.15 var(--fd);color:var(--gD);margin-top:3px}
.score{display:flex;align-items:center;gap:8px;background:#FFF8E6;border-radius:12px;padding:5px 10px;margin:7px 0 5px}
.score b{font:700 17px var(--fd);color:#B07A00;white-space:nowrap}
.score .tr{flex:1;height:10px;background:#F0E3C3;border-radius:6px;overflow:hidden}
.score .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC93C,#F28C28);border-radius:6px;transition:width 1.3s var(--smooth) .4s}
.deb .lead{font:800 11px/1.3 var(--fn);color:#4b4033;margin-bottom:5px}
.gr{display:grid;gap:4px;text-align:left}
.gr>div{display:flex;gap:8px;background:#F3FAF5;border-radius:11px;padding:5px 8px;align-items:flex-start}
.gr .L{flex:none;width:30px;height:30px;border-radius:9px;background:var(--g);color:#fff;font:700 18px/30px var(--fd);text-align:center}
.gr h4{font:700 12px var(--fd);display:flex;justify-content:space-between;gap:6px}
.gr h4 small{font:800 10px var(--fn);color:#B07A00;white-space:nowrap}
.gr p{font:800 9.5px/1.3 var(--fn);color:#4f5e54}
.gr p em{font-style:normal;color:var(--br2)}
.quote{margin-top:6px;background:var(--gD);color:#fff;border-radius:12px;padding:8px 11px;font:800 11px/1.4 var(--fn);text-align:left}
.quote b{color:var(--sun)}
.deb .bt{margin-top:7px;height:42px}
.d2 h3{font:700 16px/1.2 var(--fd);color:var(--gD);margin:6px 0 2px}
.d2 .sub{font:800 11px/1.35 var(--fn);color:#4b4033;margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.two>div{border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;gap:3px}
.two .t1{background:#FFF3E0;border:2px solid #F3C98B}.two .t2{background:#E3F6EA;border:2px solid #9ED7B1}
.two i{font-style:normal;font-size:20px;line-height:1}
.two small{font:800 9.5px/1.25 var(--fn);color:var(--mut)}
.two b{font:700 12px/1.2 var(--fd);color:var(--ink)}
.two span{font:800 10px/1.3 var(--fn);color:#4b4033}
.flow{display:flex;align-items:stretch;gap:3px;margin:8px 0 2px}
.flow div{flex:1;background:var(--g);color:#fff;border-radius:9px;padding:5px 3px;font:700 10px/1.15 var(--fd);display:flex;align-items:center;justify-content:center;text-align:center}
.flow em{font-style:normal;color:var(--g);font:700 12px var(--fd);align-self:center}
.lbl2{font:800 9.5px var(--fn);color:var(--mut);letter-spacing:.8px;margin-top:8px;text-align:left}
.own{margin-top:7px;background:#FFF8E6;border-radius:12px;padding:7px 10px;font:800 10.5px/1.4 var(--fn);color:#4b4033;text-align:left}
.own b{color:var(--br2)}
.note{margin-top:6px;font:800 9.5px/1.35 var(--fn);color:var(--mut);text-align:left}

/* fx */
#fx{z-index:60;pointer-events:none}
#hint{position:absolute;left:0;top:0;width:0;height:0;display:none;z-index:2}
#hint .rp{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px rgba(15,107,62,.45);animation:rp 1.2s ease-out infinite}
#hint .hd{position:absolute;left:-9px;top:-2px;width:42px;height:42px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));animation:press 1.2s ease-in-out infinite}
#hint.drag .rp{display:none}#hint.drag .hd{animation:none}
@keyframes rp{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes press{0%,100%{transform:translate(6px,8px)}40%{transform:translate(0,0) scale(.92)}}
.conf{position:absolute;left:0;top:0;font-size:16px;line-height:1}
.ftx{position:absolute;font:700 15px var(--fd);white-space:nowrap;pointer-events:none;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
#wipe{position:absolute;inset:0;z-index:70;pointer-events:none}
#wipe.on{pointer-events:auto}
#wipe i{position:absolute;left:50%;top:50%;width:800px;height:800px;margin:-400px 0 0 -400px;border-radius:50%;transform:scale(0)}
#wipe .w1{background:var(--sun)}#wipe .w2{background:var(--g)}
#wipe .wl{position:absolute;left:50%;top:50%;font-size:64px;transform:translate(-50%,-50%) scale(0);opacity:0}
#copy{position:absolute;left:0;right:0;bottom:6px;text-align:center;z-index:66;pointer-events:none}
#copy span{display:inline-block;font:700 9px var(--fn);color:rgba(255,255,255,.95);background:rgba(10,40,24,.5);padding:2px 9px;border-radius:999px;letter-spacing:.2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

const Snd=(()=>{
  let ctx=null,mus,sfx,on=true,nextT=0,step=0,lastBlip=0;

  function pluck(f,t,v,dest){const o=ctx.createOscillator(),o2=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='sawtooth';o2.type='square';o.frequency.value=f;o2.frequency.value=f*2.003;lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(700,t+.16);

    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o2.start(t);o.stop(t+.26);o2.stop(t+.26)}

      if(s%2===0){const bn=s%4===0?c[0]:c[0]+7;tone(mtof(bn),nextT,.18,.11,'triangle',mus,.005)}

   `<div class="wr"><span>⏰ Mulai secepatnya</span><span>1️⃣ Satu per satu</span><span>🤝 Bagi tugas</span></div>
   <div class="tasks">${TK.map((t,i)=>`<div class="tk" data-i="${i}"><h4>${t.ic} ${esc(t.n)}<span class="st">Ide ${i+1}</span></h4>
     <div class="chips"><em>Kapan</em>${D.map((x,j)=>`<button class="chip" data-k="d" data-v="${j}">${x}</button>`).join('')}<button class="chip" data-k="d" data-v="x">Nanti</button></div>
     <div class="chips"><em>PIC</em>${PIC.map(p=>`<button class="chip v2" data-k="c" data-v="${p[0]}">${p[1]}</button>`).join('')}</div></div>`).join('')}</div>
   <div class="week" id="wk">${D.map(x=>`<span>${x}</span>`).join('')}<b id="pl">🌱</b></div>
   <div class="prow"><div class="pt" id="pt">Tentukan mana yang dikerjakan dulu, kapan, dan siapa PIC-nya.</div><button class="bt" id="rn">▶ Jalankan</button></div>`);
  remark('Dari 2 ide tadi, mana yang mau dikerjakan **dulu**? Ingat 3 aturan kuning di atas, ya.','nod');
  const nextHint=()=>{for(let i=0;i<TK.length;i++){const b=$(`.tk[data-i="${i}"]`);if(sel[i].d===null){hintTap($$('.chips',b)[0].children[1]);return}if(sel[i].c===null){hintTap($$('.chips',b)[1].children[1]);return}}hintTap($('#rn'))};
  setTimeout(nextHint,600);
  $$('.tk',panel).forEach(b=>{const i=+b.dataset.i;$$('.chip',b).forEach(c=>c.onclick=()=>{const k=c.dataset.k,v=c.dataset.v;sel[i][k]=k==='d'&&v!=='x'?+v:v;
    $$(`.chip[data-k="${k}"]`,b).forEach(x=>x.classList.toggle('on',x===c));SFX.pop();b.classList.remove('err','ok');nextHint()})});
  const check=()=>{const P=[],bad=new Set(),nm=TK.map(t=>`"${t.n}"`),hasD=x=>typeof x.d==='number';
    sel.forEach((x,k)=>{if(!hasD(x)){P.push(`${nm[k]} belum punya hari yang jelas.`);bad.add(k)}
      else if(!x.c){P.push(`${nm[k]} belum ada PIC-nya.`);bad.add(k)}
      else if(x.c==='s'){P.push(`${nm[k]}: "Siapa saja" artinya PIC tidak jelas.`);bad.add(k)}});
    const [a,b]=sel;
    if(hasD(a)&&hasD(b)){
      if(a.d===b.d){P.push('Dua ide di hari yang sama? Kerjakan satu per satu.');bad.add(0);bad.add(1)}
      else if(Math.min(a.d,b.d)!==0){P.push('Jangan ditunda! Mulai salah satu secepatnya, hari Senin.');bad.add(a.d<b.d?0:1)}}
    if(a.c==='a'&&b.c==='a'){P.push('Semua dikerjakan sendiri? Bagi juga dengan rekan kerja.');bad.add(0);bad.add(1)}
    else if(a.c==='r'&&b.c==='r'){P.push('Semua dilempar ke rekan kerja? Ambil juga bagianmu.');bad.add(0);bad.add(1)}
    return{P,bad}};
  let tries=0;
  return new Promise(res=>{$('#rn').onclick=async()=>{const btn=$('#rn');btn.disabled=true;hintOff();$$('.tk',panel).forEach(t=>t.classList.remove('ok','err'));
    const {P:prob,bad}=check();let done=0;const tree=$('#tree');tree.classList.remove('wilt');$('#pl').textContent='🌱';
    for(let d=0;d<5;d++){$$('#wk span').forEach((e,k)=>e.classList.toggle('on',k===d));SFX.tick();
      TK.forEach((t,i)=>{if(sel[i].d===d){const blk=$(`.tk[data-i="${i}"]`);if(bad.has(i)){blk.classList.add('err');floatAt(blk,'✗','#E5533D');SFX.no()}else{blk.classList.add('ok');done++;floatAt(blk,'✓ beres','#16995c');SFX.ok()}}});
      $('#pl').textContent=['🌱','🪴','🌳'][done];await sleep(600)}
    $$('#wk span').forEach(e=>e.classList.remove('on'));
    bad.forEach(i=>$(`.tk[data-i="${i}"]`).classList.add('err'));
    if(!prob.length){$('#pl').textContent='🌳';msg('Dimulai secepatnya, satu per satu, dan tugas terbagi. Pohonmu berbuah! ☕',1);tika('jump');await sleep(1200);res(st3(tries,0,1))}
    else{tries++;SFX.no();$('#pl').textContent='🥀';tree.classList.add('wilt');tika('sad');msg(prob[0],0);remark('Yah, pohonnya layu. Lihat ide yang merah, perbaiki, lalu jalankan lagi.');btn.disabled=false;
      setTimeout(()=>{tree.classList.remove('wilt');tika('')},1600);
      hintLater(()=>{const i=[...bad][0];const blk=$(`.tk[data-i="${i}"]`);if(blk)hintTap($$('.chips',blk)[0].children[1])},1400)}}});
}

/* ---------- kartu selesai tahap ---------- */
const INS=[['G','Goal','Apa tujuan yang ingin dicapai?','Sebelum merawat, kamu mengarahkan cahaya ke tanaman 🎯 dulu. Dalam coaching, tim diajak **berpikir apa yang ingin dicapai**. Ini disebut **menetapkan Goal**.'],
  ['R','Reality','Apa yang sedang terjadi saat ini?','Kamu memeriksa kondisi bibit sebelum bertindak. Ini namanya **Reality Check**: Mengajak tim **sadar dan melihat kondisi** yang terjadi sekarang.'],
  ['O','Options','Pilihan apa yang mungkin?','Kamu menumbuhkan banyak cabang ide sebelum memilih. Leader **memancing tim ikut berpikir** dengan bertanya: "Menurut kamu, pilihan-pilihan apa yang bisa jadi solusinya?"'],
  ['W','Way Forward','Langkah apa yang akan dilakukan?','Kamu menentukan ide mana yang dikerjakan dulu, kapan, dan siapa PIC-nya. Supaya pilihan **tidak cuma berhenti jadi obrolan**, tentukan **langkah lanjutan**.']];
function stageClear(i,s){return new Promise(res=>{const c=h('div','clear',`<div class="unl">🔓 LANGKAH TERBUKA</div><div class="big"><b>${INS[i][0]}</b><span>${INS[i][1]}</span></div>
  <div class="stars">${[0,1,2].map(k=>`<i>${k<s?'⭐':'☆'}</i>`).join('')}</div><div class="q">❓ ${INS[i][2]}</div><p>${fmt(INS[i][3])}</p><button class="bt wide">${i<3?'Lanjut ▶':'Lihat hasil ▶'}</button>`,panel);
  c.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:400,easing:'cubic-bezier(.34,1.56,.64,1)'});
  $$('.stars i',c).forEach((e,k)=>e.animate([{transform:'scale(0) rotate(-90deg)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:450,delay:300+k*180,fill:'backwards'}));
  hintLater(()=>hintTap($('.bt',c)),1800);
  $('.bt',c).onclick=()=>{hintOff();SFX.tap();res()}})}

/* =================== START / BRIEFING =================== */
function startScreen(){return new Promise(res=>{
  setHud(false);
  const s=h('div','start',`    <div class="sTitle"><span class="chipM">🌱 Misi Berkebun</span><h1>Kebun <span>GROW</span></h1><p>Bantu Tika merawat bibit kopi sampai berbuah ya</p></div>
    <img class="sTika" alt="Tika">
    <div class="sCard"><label>Halo!</label>
      <div class="sapa">${['Bapak','Ibu'].map(x=>`<button data-v="${x}">${x}</button>`).join('')}</div>
      <input id="nm" maxlength="16" autocomplete="off" placeholder="Tulis nama panggilanmu..." enterkeyhint="go">
      <div class="pv" id="pv">Pilih sapaan, lalu tulis nama panggilanmu.</div>
      <button class="bt wide" id="go" disabled>Mulai Gamifikasi ▶</button>
      <div class="snd">🎧 Nyalakan suara biar makin seru</div></div>`,ui);
  $('.sTika',s).src=IMG;
  for(let i=0;i<8;i++){const f=h('span','fl',['🍃','☕','🌱','✨'][i%4],s);f.style.left=rand(4,330)+'px';f.style.top=rand(30,330)+'px';f.style.animationDelay=(-rand(0,4))+'s'}
  $('.sTitle',s).animate([{opacity:0,transform:'translateY(-30px) scale(.9)'},{opacity:1,transform:'none'}],{duration:700,easing:'cubic-bezier(.34,1.56,.64,1)'});
  $('.sTika',s).animate([{transform:'translateX(-50%) translateY(200px)'},{transform:'translateX(-50%) translateY(-10px)',offset:.7},{transform:'translateX(-50%)'}],{duration:900,delay:200,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  $('.sCard',s).animate([{opacity:0,transform:'translateY(80px)'},{opacity:1,transform:'none'}],{duration:700,delay:400,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  const inp=$('#nm',s),go=$('#go',s),pv=$('#pv',s);
  const upd=()=>{const n=inp.value.trim().replace(/\s+/g,' ');go.disabled=!(n&&S.sapa);
    pv.innerHTML=S.sapa&&n?`Tika akan memanggilmu <b>${esc(S.sapa+' '+n)}</b> 👋`:!S.sapa?'Pilih sapaan: Bapak atau Ibu.':'Sekarang tulis nama panggilanmu.'};
  $$('.sapa button',s).forEach(b=>b.onclick=()=>{S.sapa=b.dataset.v;$$('.sapa button',s).forEach(x=>x.classList.toggle('on',x===b));SFX.pop();upd()});
  inp.addEventListener('input',upd);
  const start=async()=>{const n=inp.value.trim().replace(/\s+/g,' ');if(!n||!S.sapa)return;S.name=n.slice(0,16);inp.blur();Snd.init();SFX.win();
    await wipe(async()=>{s.remove();setWorld('garden');fit(true)});res()};
  go.onclick=start;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();start()}});
})}

/* =================== PETUNJUK =================== */

  const bd=h('div','backdrop','',ui);
  const c=h('div','card guide',`<h2>📋 Cara Bermain</h2><div class="sub">Ada 4 tantangan. Tiap tantangan menumbuhkan pohon kopimu.</div>
    <div class="gg">
     <div class="gc"><div class="ic"><b>G</b>🪞</div><strong>Arahkan Cahaya</strong><span>Putar cermin, sinari tanaman 🎯</span></div>

/* =================== DEBRIEF =================== */
function sendComplete(){try{
    window.parent.postMessage("scoreBarFound", "*");
    window.top.postMessage("scoreBarFound", "*");
  }catch(e){}}
function debrief(){
  const tot=S.stars.reduce((a,b)=>a+b,0);setHud(false);hideBub();
  const R=[['G','Goal','Apa tujuan yang ingin dicapai?','Mengarahkan cahaya ke tanaman 🎯.'],
    ['R','Reality','Apa yang sedang terjadi saat ini?','Memeriksa kondisi bibit sebelum merawat.'],
    ['O','Options','Pilihan apa yang mungkin?','Menumbuhkan banyak cabang ide, lalu memilih 2.'],
    ['W','Way Forward','Langkah apa yang akan dilakukan?','Menentukan mana yang dulu, kapan, dan PIC-nya.']];
  const bd=h('div','backdrop','',ui);bd.animate([{opacity:0},{opacity:1}],{duration:300});app.classList.add('dim');
  const show=(html,cls)=>{const c=h('div','card deb '+(cls||''),html,ui);
    c.animate([{opacity:0,transform:'translateY(60px) scale(.95)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.34,1.56,.64,1)'});
    [...c.children].forEach((e,i)=>e.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:420,delay:220+i*80,fill:'backwards'}));return c};
  const c1=show(`<div class="top"><div class="dtree">${treeSVG(4,'34 14 132 188')}<span class="sp" style="left:2px;top:4px">✨</span><span class="sp" style="right:2px;top:30px;animation-delay:-1s">☕</span></div><div style="flex:1;min-width:0"><span class="chipM">✓ KEBUN SELESAI</span><h2>Hebat, ${esc(P())}!</h2><div class="dsub">Pohon kopimu sudah berbuah ☕</div>
    <div class="score"><b>⭐ ${tot}/12</b><div class="tr"><i></i></div></div></div></div>
    <div class="lead">Pola yang tadi kamu mainkan disebut model <b>GROW</b>. Pola ini membantu tim memahami:</div>
    <div class="gr">${R.map((r,i)=>`<div><span class="L">${r[0]}</span><div style="flex:1"><h4>${r[1]}<small>${'⭐'.repeat(S.stars[i])}${'☆'.repeat(3-S.stars[i])}</small></h4><p><em>Pertanyaan:</em> ${r[2]}<br><em>Di kebun:</em> ${r[3]}</p></div></div>`).join('')}</div>
    <div class="quote">Dengan GROW, tim diberi kesempatan <b>ikut memikirkan</b> kondisi kerjaan dan cara memperbaikinya untuk meningkatkan kinerja.</div>
    <button class="bt wide" id="nx2">Lanjut ▶</button>`);
  setTimeout(()=>{$('.score .tr i',c1).style.width=(tot/12*100)+'%'},50);
  setTimeout(()=>{SFX.win();burst(40)},500);
  hintLater(()=>hintTap($('#nx2')),4000);
  $('#nx2').onclick=async()=>{hintOff();SFX.tap();
    await c1.animate([{opacity:1},{opacity:0,transform:'translateX(-40px)'}],{duration:260,fill:'forwards'}).finished.catch(()=>{});c1.remove();
    show(`<span class="chipM">💡 SATU HAL PENTING</span>
      <h3>Sebelum pakai GROW, pastikan dulu pemahaman tim</h3>
      <div class="sub">Coaching bukan berarti leader menahan semua jawaban. Baca dulu kebutuhannya:</div>
      <div class="two">
        <div class="t1"><i>🧑‍🏫</i><small>Belum tahu / belum bisa</small><b>Ajarkan atau tunjukkan dulu</b><span>Gap-nya ada di pengetahuan atau keterampilan.</span></div>
        <div class="t2"><i>🌱</i><small>Sudah punya bekal</small><b>Bantu berpikir dengan GROW</b><span>Perlu dibantu mengurai masalah dan menentukan langkah.</span></div>
      </div>
      <div class="lbl2">RUTINITAS KEPUTUSAN</div>
      <div class="flow"><div>Baca kebutuhannya</div><em>›</em><div>Tentukan respons</div><em>›</em><div>Bantu berpikir</div><em>›</em><div>Sepakati langkah</div></div>
      <div class="own">Kenapa penting? Membantu tim berpikir memberi mereka kesempatan membangun <b>ownership</b>: Rasa memiliki sekaligus tanggung jawab atas pekerjaan yang sedang dipegang.</div>
      <div class="note">Ingat: GROW bukan alasan menolak memberi jawaban, dan bukan untuk menguji orang yang memang belum tahu.</div>
      <div class="sub" style="margin:8px 0 0">Sampai ketemu di misi berikutnya! 👋</div>
      <button class="bt wide" id="again">↺ Ulangi Gamifikasi</button>`,'d2');
    sendComplete();
    $('#again').onclick=()=>{SFX.tap();location.reload()};
  };
}

/* =================== ALUR UTAMA =================== */
const CHAP=[['Arahkan Cahaya','TANTANGAN 1 · GOAL','Tantangan pertama: Tanaman butuh cahaya yang **tepat sasaran**. Kita pakai cermin untuk mengarahkannya.'],
  ['Periksa Bibit','TANTANGAN 2 · REALITY','Tantangan kedua: Kenali **kondisi sebenarnya** bibit kita sebelum merawatnya.'],
  ['Tumbuhkan Ide','TANTANGAN 3 · OPTIONS','Menurut {p}, **pilihan-pilihan apa** yang bisa jadi solusinya? Tumbuhkan sebanyak mungkin, lalu pilih 2.'],
  ['Susun Rencana','TANTANGAN 4 · WAY FORWARD','Dari 2 pilihan tadi, **mana yang mau dilakukan dulu**? Yuk susun jadwalnya supaya tidak berhenti jadi obrolan.']];
const GAMES=[gameG,gameR,gameO,gameW],NAMES=['Bibit','Tunas','Batang','Rimbun','Berbuah'];
async function main(){
  await startScreen();
  buildScene();setHud(true);setLetters(-1);setStage('Kebun GROW','PERSIAPAN');
  $('#tika').animate([{transform:'translateX(-130%)'},{transform:'translateX(6%)',offset:.75},{transform:'none'}],{duration:800,easing:'cubic-bezier(.22,1,.36,1)'});
  await sleep(700);
  await say('Halo, {p}! Saya **Tika**. Selamat datang di kebun kita.','jump');
  await say('Bantu Tika merawat bibit kopi ini sampai **berbuah** ya.','nod');
  for(let i=0;i<4;i++){
    setLetters(i);setStage(CHAP[i][0],CHAP[i][1]+' · POHON: '+NAMES[i].toUpperCase());
    hideBub();setSign(i,true);
    await caption(CHAP[i][0],CHAP[i][1],1900,`🌱 Target pohon: ${esc(STAGE_N[i])} → <b>${esc(STAGE_N[i+1])}</b>`);
    await say(CHAP[i][2],'nod');
    const s=await GAMES[i]();hintOff();
    S.stars[i]=s;addStars();
    await growPopup(i+1);
    grow(i+1,true);SFX.grow();burst(18);remark(i<3?`Mantap, {p}! Pohonnya sekarang sudah **${STAGE_N[i+1].toLowerCase()}**. 🌱`:'Pohon kopimu **berbuah**! ☕','jump');
    await sleep(900);
    await stageClear(i,s);
    closePanel();await sleep(350);
  }
  setLetters(4);setStage('Kebun Selesai','POHON: BERBUAH');
  await say('Lihat, {p}! Pohon kopinya berbuah. Kamu merawatnya dari awal sampai akhir.','jump');
  await say('Sebelum pulang, yuk lihat apa arti 4 langkah tadi.','nod');
  await wipe(async()=>{hideBub()});
  debrief();
}
main().catch(e=>console.error(e));
})();
</script>
